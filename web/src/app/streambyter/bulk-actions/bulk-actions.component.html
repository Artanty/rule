@if (rulesCount > 0) {
    <div class="bulk-actions">
        <button class="btn-small" (click)="selectAll.emit()">✓ Select All</button>
        <button class="btn-small" (click)="selectRegular.emit()">📌 Select Regular</button>
        <button class="btn-small" (click)="selectNone.emit()">✗ Select None</button>
        <button class="btn-small primary" (click)="generateNamesForSelected.emit()" [disabled]="selectedCount === 0">
            🎨 Name Selected
        </button>

        @if (selectedCount > 0) {
            <div class="bulk-mapping">
                <span class="selected-count">{{ selectedCount }} rule(s) selected</span>
                <select [(ngModel)]="bulkMappingName" (ngModelChange)="onBulkMappingNameChange($event)">
                    <option [value]="null">-- Select trigger mapping --</option>
                    @for (mapping of triggerMappings; track mapping.name) {
                        <option [value]="mapping.name">{{ mapping.name }} (Ch{{ mapping.triggerMidiChannel }})</option>
                    }
                </select>
                <button class="btn-small primary" (click)="applyBulkMapping.emit()">Apply to Selected</button>
            </div>
            <button
                class="btn-small warn"
                (click)="deleteSelected.emit()"
                [disabled]="selectedCount === 0"
                data-testid="delete-selected-rules"
            >
                🗑 Delete Selected
            </button>
        }
    </div>
}
